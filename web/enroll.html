<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>itty enrollment</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="page">
<main class="card">
  <svg class="mark" viewBox="0 0 96 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect class="mark-field" width="96" height="96" rx="21.5"/>
    <path class="mark-glyph" d="M30 34 48 48 30 62M52 63H68"/>
  </svg>
  <h1>Enroll a passkey</h1>
  <p class="card-text">Register this device so it can unlock itty with Face ID.</p>
  <button id="enroll" class="pill" type="button">Register passkey</button>
  <div id="status" class="status" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span class="status-text"></span>
  </div>
</main>
<script src="/spring.js"></script>
<script src="/press.js"></script>
<script src="/status.js"></script>
<script src="/passkey.js"></script>
<script src="/enroll.js"></script>
</body>
</html>
