<!doctype html>
<html lang="en" data-keyboard="closed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="itty">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>itty</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="locked">
<div id="app" inert>
  <div id="switcher" class="switcher">
    <button id="session-pill" class="session-pill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="session-menu" aria-label="Switch session">
      <span class="spinner" aria-hidden="true"></span>
      <span class="status-text" aria-live="polite">tmux</span>
      <svg class="session-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="session-scrim" hidden></div>
    <div id="session-menu" class="session-menu" role="menu" aria-label="tmux sessions" inert>
      <div class="session-pages">
        <div class="session-page" data-page="sessions"></div>
        <div class="session-page" data-page="windows" inert></div>
      </div>
    </div>
  </div>
  <div id="terminal" aria-label="Terminal"></div>
  <div id="keybar" class="dock" data-dock="collapsed">
    <div class="dock-surface">
      <button id="dock-handle" class="dock-handle" type="button" aria-label="Show keys" aria-expanded="false" aria-controls="keys">
        <svg class="dock-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        <span class="dock-armed" aria-hidden="true">⌃ Ctrl</span>
      </button>
      <div id="keys" class="dock-keys" role="toolbar" aria-label="Terminal keys" inert></div>
    </div>
  </div>
</div>
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <div class="lock-content">
    <svg class="mark" viewBox="0 0 96 96" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect class="mark-field" width="96" height="96" rx="21.5"/>
      <path class="mark-glyph" d="M30 34 48 48 30 62M52 63H68"/>
    </svg>
    <h1 id="lock-title">itty</h1>
    <p class="lock-subtitle">Locked</p>
    <button id="unlock" class="pill" type="button">
      <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 8.5V7a3 3 0 0 1 3-3h1.5M15.5 4H17a3 3 0 0 1 3 3v1.5M20 15.5V17a3 3 0 0 1-3 3h-1.5M8.5 20H7a3 3 0 0 1-3-3v-1.5"/>
        <path d="M9 9.5v1.5M15 9.5v1.5M12 9.5v3.5h-1M9 16c1.7 1.4 4.3 1.4 6 0"/>
      </svg>
      <span>Unlock</span>
    </button>
    <div id="lock-status" class="status" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span class="status-text"></span>
    </div>
    <p id="cert-warning" class="lock-note" role="status"></p>
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/theme.js"></script>
<script src="/attempts.js"></script>
<script src="/spring.js"></script>
<script src="/presence.js"></script>
<script src="/press.js"></script>
<script src="/status.js"></script>
<script src="/keyboard.js"></script>
<script src="/repeat.js"></script>
<script src="/focus.js"></script>
<script src="/passkey.js"></script>
<script src="/keys.js"></script>
<script src="/sessions.js"></script>
<script src="/switcher.js"></script>
<script src="/keybar.js"></script>
<script src="/dock.js"></script>
<script src="/mouse.js"></script>
<script src="/stepper.js"></script>
<script src="/momentum.js"></script>
<script src="/gesture.js"></script>
<script src="/touch.js"></script>
<script src="/app.js"></script>
</body>
</html>
